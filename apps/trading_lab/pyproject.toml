[tool.poetry]
name = "trading-lab"
version = "0.1.0"
description = "Autonomous Paper-Trading Lab with Deterministic Quantitative Analytics, Ollama LLM Thesis Engine, Hard RiskGate, and TimescaleDB Ledger"
authors = ["Homelab Trading Lab"]
packages = [{ include = "trading_lab", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
alpaca-py = ">=0.45.0"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
httpx = ">=0.27.0"
sqlalchemy = ">=2.0.30"
psycopg = { version = ">=3.2.0", extras = ["binary"] }
apscheduler = ">=3.10.4,<4.0.0"
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
feedparser = ">=6.0.11"
jinja2 = ">=3.1.4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.7"
ruff = ">=0.6.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
