services:
  trading-lab-db:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-lab-db
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    environment:
      POSTGRES_DB: trading_lab
      POSTGRES_USER: trading_lab
      POSTGRES_PASSWORD: ${TRADING_LAB_DB_PASSWORD:-trading_lab_timescale_2026}
    volumes:
      - trading_lab_timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_lab -d trading_lab"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - trading-lab-net

  trading-lab-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trading-lab-app:local
    container_name: trading-lab-app
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1536m
    depends_on:
      trading-lab-db:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgresql+psycopg://trading_lab:${TRADING_LAB_DB_PASSWORD:-trading_lab_timescale_2026}@trading-lab-db:5432/trading_lab
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-huihui_ai/qwen3-abliterated:8b-v2}
      OLLAMA_TIMEOUT_SECONDS: "120"
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_PAPER_BASE_URL: https://paper-api.alpaca.markets
      PAPER_ONLY: "true"
      TICKER_ALLOWLIST: AAPL,MSFT,NVDA,AMZN,GOOGL,SPY
      BENCHMARK_SYMBOL: SPY
      MAX_POSITION_PCT: "0.05"
      DEFAULT_STOP_LOSS_PCT: "0.03"
      MIN_STOP_LOSS_PCT: "0.005"
      MAX_STOP_LOSS_PCT: "0.15"
      DAILY_DRAWDOWN_LIMIT_PCT: "0.03"
      INITIAL_CASH: "100000.0"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TIMEZONE: America/New_York
      SCHEDULER_MARKET_CRON: "*/30 9-16 * * 1-5"
      SCHEDULER_REFLECTION_CRON: "0 10 * * 6"
      LOG_DIR: /app/logs
      ARTIFACTS_DIR: /app/artifacts
    volumes:
      - trading_lab_logs:/app/logs
      - trading_lab_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trading-lab-net

volumes:
  trading_lab_timescaledb:
  trading_lab_logs:
  trading_lab_artifacts:

networks:
  trading-lab-net:
    driver: bridge
