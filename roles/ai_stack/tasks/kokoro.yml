---
# Kokoro-FastAPI CPU-pinned TTS deployment tasks (isolated from core infrastructure)

- name: Template Kokoro-FastAPI Docker Compose stack file
  ansible.builtin.template:
    src: kokoro-fastapi-compose.yml.j2
    dest: "{{ ai_stack_compose_dir }}/kokoro-fastapi-stack.yml"
    owner: root
    group: root
    mode: "0644"

- name: Check whether Kokoro-FastAPI Compose stack file exists
  ansible.builtin.stat:
    path: "{{ ai_stack_compose_dir }}/kokoro-fastapi-stack.yml"
  register: ai_stack_kokoro_compose_stat

- name: Deploy Kokoro-FastAPI stack via Docker Compose V2
  community.docker.docker_compose_v2:
    project_name: kokoro-fastapi-stack
    project_src: "{{ ai_stack_compose_dir }}"
    files:
      - kokoro-fastapi-stack.yml
    state: present
    remove_orphans: true
  when: not ansible_check_mode or ai_stack_kokoro_compose_stat.stat.exists

- name: Wait for Kokoro-FastAPI health endpoint readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ai_stack_kokoro_host_port }}/health"
    method: GET
    status_code: 200
  register: ai_stack_kokoro_health_ready
  retries: 30
  delay: 5
  until: ai_stack_kokoro_health_ready.status == 200
  when: not ansible_check_mode
