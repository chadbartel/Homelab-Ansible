---
# Open WebUI deployment tasks (isolated from core infrastructure)

- name: Template Open WebUI Docker Compose stack file
  ansible.builtin.template:
    src: open-webui-compose.yml.j2
    dest: "{{ ai_stack_compose_dir }}/open-webui-stack.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Open WebUI stack via Docker Compose V2
  community.docker.docker_compose_v2:
    project_name: open-webui-stack
    project_src: "{{ ai_stack_compose_dir }}"
    files:
      - open-webui-stack.yml
    state: present
    remove_orphans: true
