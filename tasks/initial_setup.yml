---
# Initial system setup tasks
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-venv
      - python3-dev
    state: present

- name: Ensure Linux headers for the running kernel are installed (required for NVIDIA DKMS build)
  ansible.builtin.apt:
    name: "linux-headers-{{ ansible_kernel }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nvidia_kernel_headers_install

- name: Install proprietary NVIDIA headless driver stack for Ubuntu 24.04 RTX 2070 SUPER
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - nvidia-driver-550
      - nvidia-headless-550
      - nvidia-utils-550
      - nvidia-modprobe
    state: present
  register: nvidia_driver_install
  retries: 3
  delay: 10
  until: nvidia_driver_install is success

# A kernel update (e.g. via unattended-upgrades) can leave the NVIDIA DKMS module
# built only for a previous kernel. Re-run dkms here so the module always matches
# the kernel we just confirmed headers for, instead of only retrying at first install.
- name: Rebuild NVIDIA DKMS module for the currently running kernel
  ansible.builtin.command:
    cmd: dkms autoinstall
  register: nvidia_dkms_autoinstall
  changed_when: "'Building module' in nvidia_dkms_autoinstall.stdout"
  failed_when: false

- name: Check NVIDIA DKMS module status for the running kernel
  ansible.builtin.command:
    cmd: "dkms status -k {{ ansible_kernel }}"
  register: nvidia_dkms_status
  changed_when: false
  failed_when: false

- name: Fail with actionable diagnostics if NVIDIA module is not built for the running kernel
  ansible.builtin.fail:
    msg: >-
      NVIDIA DKMS module is not installed for the running kernel ({{ ansible_kernel }}).
      dkms status: "{{ nvidia_dkms_status.stdout | default('n/a') }}".
      This usually means Secure Boot is rejecting the unsigned module, or the module
      failed to build against the headers above. Enroll an MOK key for Secure Boot
      (or disable it), confirm 'dkms autoinstall' succeeds manually on the host, then
      re-run the playbook.
  when: "'installed' not in nvidia_dkms_status.stdout"

- name: Load the NVIDIA kernel module
  ansible.builtin.command:
    cmd: modprobe nvidia
  register: nvidia_modprobe
  changed_when: false
  failed_when: false

# Headless hosts have no Xorg/udev trigger to create /dev/nvidia*, so
# nvidia-persistenced (running as its unprivileged service user) finds no device
# files on first boot after a module (re)load. nvidia-modprobe creates them directly.
- name: Ensure NVIDIA device nodes exist for the persistence daemon
  ansible.builtin.command:
    cmd: nvidia-modprobe -c0 -u
  register: nvidia_modprobe_devices
  changed_when: false
  failed_when: nvidia_modprobe_devices.rc != 0

# Make device-node creation self-healing across reboots/module reloads, since this
# host has no display manager to trigger udev's usual nvidia device creation path.
- name: Create systemd drop-in directory for nvidia-persistenced
  ansible.builtin.file:
    path: /etc/systemd/system/nvidia-persistenced.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install systemd drop-in to recreate NVIDIA device nodes before the daemon starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/nvidia-persistenced.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStartPre=-/usr/bin/nvidia-modprobe -c0 -u
  register: nvidia_persistenced_override

- name: Enable NVIDIA persistence daemon
  block:
    - name: Start and enable the NVIDIA persistence daemon
      ansible.builtin.systemd_service:
        name: nvidia-persistenced
        enabled: true
        state: started
        daemon_reload: "{{ nvidia_persistenced_override is changed }}"
  rescue:
    - name: Gather NVIDIA persistence daemon failure diagnostics
      ansible.builtin.command:
        cmd: journalctl -xeu nvidia-persistenced.service --no-pager -n 50
      register: nvidia_persistenced_journal
      changed_when: false
      failed_when: false

    - name: Fail with NVIDIA persistence daemon diagnostics
      ansible.builtin.fail:
        msg: >-
          nvidia-persistenced failed to start even though the DKMS module reports
          "installed" for kernel {{ ansible_kernel }}. This is commonly caused by
          Secure Boot rejecting the unsigned kernel module at load time, a stale
          module still resident in the kernel from before a driver upgrade (requires
          a reboot to clear), or missing/unreadable /dev/nvidia* device files on a
          headless host with no udev trigger to create them. Check 'mokutil --sb-state',
          confirm 'nvidia-modprobe -c0 -u' succeeds and /dev/nvidia* exist with correct
          permissions, then review the journal below.
          journalctl: {{ nvidia_persistenced_journal.stdout | default('n/a') }}

- name: Create Python virtual environment directory
  ansible.builtin.file:
    path: "{{ python_venv_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ python_venv_path }}"
    creates: "{{ python_venv_path }}/bin/activate"
  register: venv_created

- name: Upgrade pip in virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: "{{ python_venv_path }}"
    virtualenv_command: "python3 -m venv"

- name: Install Python packages in virtual environment
  ansible.builtin.pip:
    name: "{{ python_packages }}"
    state: present
    virtualenv: "{{ python_venv_path }}"
    virtualenv_command: "python3 -m venv"

- name: Create symbolic link for system-wide access to venv python
  ansible.builtin.file:
    src: "{{ python_venv_path }}/bin/python"
    dest: "/usr/local/bin/ansible-python"
    state: link
    force: true

# Prepare Docker's data filesystem before tasks/docker.yml can start or restart
# the daemon. The filesystem module is non-destructive when already formatted.
- name: Gather Docker service facts before changing its data mount
  ansible.builtin.service_facts:

- name: Check whether the Docker data device exists
  ansible.builtin.stat:
    path: "{{ docker_data_device | default('') }}"
  register: docker_data_device_stat
  when: docker_data_device | default('') | length > 0

- name: Ensure the Docker data device is formatted as ext4
  community.general.filesystem:
    dev: "{{ docker_data_device }}"
    fstype: ext4
  when:
    - docker_data_device | default('') | length > 0
    - docker_data_device_stat.stat.exists | default(false)
    - docker_data_format | default(false) | bool

- name: Read the Docker data filesystem UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value {{ docker_data_device }}"
  register: docker_data_uuid
  changed_when: false
  when:
    - docker_data_device | default('') | length > 0
    - docker_data_device_stat.stat.exists | default(false)

- name: Check the currently mounted Docker data filesystem
  ansible.builtin.command:
    cmd: "findmnt --noheadings --output UUID --target {{ docker_data_mount_path }}"
  register: docker_current_mount_uuid
  changed_when: false
  failed_when: false
  when:
    - docker_data_uuid.stdout | default('') | length > 0

- name: Stop Docker before changing its data mount
  ansible.builtin.systemd_service:
    name: docker
    state: stopped
  when:
    - ansible_facts.services['docker.service'] is defined
    - ansible_facts.services['docker.service'].state == 'running'
    - docker_current_mount_uuid.stdout | default('') != docker_data_uuid.stdout | default('')

- name: Ensure Docker data mount directory exists
  ansible.builtin.file:
    path: "{{ docker_data_mount_path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  when:
    - docker_data_uuid.stdout | default('') | length > 0

- name: Mount Docker data filesystem by UUID
  ansible.posix.mount:
    path: "{{ docker_data_mount_path }}"
    src: "UUID={{ docker_data_uuid.stdout }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  when:
    - docker_data_uuid.stdout | default('') | length > 0

- name: Start Docker after changing its data mount
  ansible.builtin.systemd_service:
    name: docker
    state: started
  when:
    - ansible_facts.services['docker.service'] is defined
    - ansible_facts.services['docker.service'].state == 'running'
    - docker_current_mount_uuid.stdout | default('') != docker_data_uuid.stdout | default('')

# Configure IP forwarding for Tailscale and other networking features
- name: Enable persistent IPv4 forwarding for Tailscale
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: Enable persistent IPv6 forwarding (if needed for Tailscale exit node)
  ansible.builtin.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '{{ "1" if enable_ipv6_forwarding | default(false) else "0" }}'
    sysctl_set: true
    state: present
    reload: true

- name: Display IP forwarding configuration
  ansible.builtin.debug:
    msg: |
      ✅ IP forwarding configured for Tailscale:
      IPv4 forwarding: enabled
      IPv6 forwarding: {{ "enabled" if enable_ipv6_forwarding | default(false) else "disabled" }}

- name: Display virtual environment info
  ansible.builtin.debug:
    msg: |
      ✅ Python virtual environment created:
      Path: {{ python_venv_path }}
      Python: {{ python_venv_path }}/bin/python
      Pip: {{ python_venv_path }}/bin/pip
      Packages installed: {{ python_packages | join(', ') }}

- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    comment: "Admin User"
    groups: sudo
    state: present
    shell: /bin/bash
    password: "{{ admin_password | password_hash('sha512') }}"
  when: 
    - ansible_user != admin_user
    - admin_password | length > 0

- name: Set up SSH key authentication
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ admin_ssh_key_public }}"
  when: admin_ssh_key_public | length > 0

- name: Configure SSH security
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
  loop:
    - regexp: '^#?PasswordAuthentication'
      line: "PasswordAuthentication no"
    - regexp: '^#?PermitRootLogin'
      line: "PermitRootLogin no"
  notify: restart ssh

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Create Pi-hole data directory
  ansible.builtin.file:
    path: "{{ pihole_data_path }}"
    state: directory
    mode: '0755'
    owner: root
    group: root